server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chamadas da API vão pro container do backend, pelo nome do serviço no compose
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deixo o /health do backend acessível também, pra conferir que os dois conversam
    location = /health {
        proxy_pass http://backend:3001/health;
    }

    # Arquivos com hash no nome podem ficar em cache por bastante tempo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Configuração pública da instalação, gerada quando o container sobe.
    # Sem cache, para valer logo depois de reiniciar com outros valores.
    # Se faltar, responde 404 em vez de cair no index.html.
    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # É uma SPA: qualquer rota que não seja arquivo volta pro index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
